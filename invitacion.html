<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activar cuenta directiva · Municipio Escolar</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="pantalla-centrada">
  <div class="tarjeta-acceso">
    <div class="text-center mb-3">
      <div class="sello">ME</div>
      <h1 class="h4 mb-1">Invitación directiva</h1>
      <p class="text-muted small mb-0">Crea o activa tu cuenta para consultar los resultados en tiempo real.</p>
    </div>

    <div id="estadoInvitacion" class="alert alert-info small">Verificando invitación...</div>

    <form id="formRegistro" class="d-none">
      <div class="mb-2">
        <label class="form-label">Correo invitado</label>
        <input type="email" id="email" class="form-control" readonly>
      </div>
      <div class="mb-2">
        <label class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-control" minlength="8" required>
        <div class="form-text">Mínimo 8 caracteres.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Repite la contraseña</label>
        <input type="password" id="password2" class="form-control" minlength="8" required>
      </div>
      <button class="btn btn-civico w-100" type="submit">Crear y activar cuenta</button>
    </form>

    <button id="btnActivar" class="btn btn-civico w-100 d-none" type="button">Activar invitación con mi sesión</button>
    <a href="index.html" class="btn btn-outline-secondary w-100 mt-2">Ir al inicio de sesión</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="js/paginas/invitacion/entry.js"></script>

</body>
</html>
